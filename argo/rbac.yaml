apiVersion: v1
kind: ServiceAccount
metadata:
  name: squeeze-workflow
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squeeze-workflow
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squeeze-workflow
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squeeze-workflow
subjects:
  - kind: ServiceAccount
    name: squeeze-workflow
    namespace: default
