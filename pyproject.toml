[project]
name = "living-cost-squeeze"
version = "0.1.0"
description = "Who is losing Australia's cost-of-living race: living costs, wages, and prices."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "lakefs: needs the local lakeFS and MinIO compose stack",
    "slow: full nowcast or warehouse rebuild",
]
addopts = "-m 'not lakefs'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
