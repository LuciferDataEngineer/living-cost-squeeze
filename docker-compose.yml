# Local write-audit-publish stack. lakeFS stores objects in MinIO.
# Jaeger receives pipeline traces when OTEL_EXPORTER_OTLP_ENDPOINT is set.

services:
  minio:
    build: ./docker/minio
    image: living-cost-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  createbucket:
    image: living-cost-minio:local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/lakefs-data

  lakefs:
    image: treeverse/lakefs:1.70.0
    depends_on:
      createbucket:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: living-cost-squeeze-lakefs-key
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_INSTALLATION_USER_NAME: admin
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: AKIAIOSFOLKFSSAMPLES
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_LOGGING_LEVEL: INFO
      # Recent AWS SDKs refuse to checksum an unseekable upload to plain HTTP MinIO.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/_health"]
      interval: 3s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
